name: Build and Deploy Backend to Remote Server

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js v22.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.14.0"

      # Step 3: Install dependencies and build on GitHub runner
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # Step 4: Verify if build output directory exists (matches your tsconfig outDir)
      - name: Check if build directory exists
        run: |
          if [ ! -d "./build" ]; then
            echo "Build directory not found, aborting deployment."
            exit 1
          else
            echo "Build directory found."
          fi

      # Step 5: Deploy to remote server via SSH using your working password pattern
      - name: Deploy to remote server
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_LIVE }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP_LIVE }}
        run: |
          # Install sshpass
          sudo apt-get update
          sudo apt-get install -y sshpass

          # Ensure remote directory exists
          sshpass -p "$SSH_PASSWORD" ssh -p 21098 -o StrictHostKeyChecking=no "$SSH_USERNAME"@"$SERVER_IP" "mkdir -p /home/azureuser/apps/hmsbackend"

          # Copy the compiled build folder and package.json to the server
          sshpass -p "$SSH_PASSWORD" scp -P 21098 -o StrictHostKeyChecking=no -r ./build ./package.json "$SSH_USERNAME"@"$SERVER_IP":/home/azureuser/apps/hmsbackend

          # Run server-side commands
          sshpass -p "$SSH_PASSWORD" ssh -p 21098 -o StrictHostKeyChecking=no "$SSH_USERNAME"@"$SERVER_IP" << 'EOF'
            cd /home/azureuser/apps/hmsbackend
            
            # Install production node_modules on the server
            npm install --production

            # If you have a command to restart your raw Node process, add it here:
            # e.g., pkill -f "node build/index.js" || true
            # nohup node build/index.js > app.log 2>&1 &
          EOF
