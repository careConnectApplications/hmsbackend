name: Build and Deploy App to Remote Server

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js v22.14.0
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.14.0"

      # Step 3: Install dependencies and build on GitHub runner
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # Step 4: Deploy using password authentication
      - name: Deploy to remote server via password
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME_LIVE }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP_LIVE }}
        run: |
          # Install sshpass
          sudo apt-get update
          sudo apt-get install -y sshpass

          # Ensure the target directory exists on the server first
          sshpass -p "$SSH_PASSWORD" ssh -p 21098 -o StrictHostKeyChecking=no "$SSH_USERNAME"@"$SERVER_IP" "mkdir -p /home/azureuser/apps/hmsbackend"

          # Copy the build output (adjust 'dist' to 'build' depending on your framework) and package.json
          sshpass -p "$SSH_PASSWORD" scp -P 21098 -o StrictHostKeyChecking=no -r ./dist ./package.json "$SSH_USERNAME"@"$SERVER_IP":/home/azureuser/apps/hmsbackend

          # Run post-deployment commands on the server (like PM2 restart)
          sshpass -p "$SSH_PASSWORD" ssh -p 21098 -o StrictHostKeyChecking=no "$SSH_USERNAME"@"$SERVER_IP" << 'EOF'
            cd /home/azureuser/apps/hmsbackend
            
            # Install production dependencies if needed
            # npm install --production

            # Restart app with PM2 (uncomment when ready)
            # pm2 restart hmsbackend || pm2 start dist/index.js --name "hmsbackend"
          EOF
